<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Arpit Kumar — AI &amp; Full-Stack Developer</title>
    <meta name="description" content="Computer Science Engineer building AI, full-stack, SaaS, mobile and cybersecurity software. Based in Bengaluru, India." />
    <meta name="author" content="Arpit Kumar" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Arpit Kumar — AI &amp; Full-Stack Developer" />
    <meta property="og:description" content="Computer Science Engineer building AI, full-stack, SaaS, mobile and cybersecurity software. Based in Bengaluru, India." />
    <meta property="og:site_name" content="Arpit Kumar" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arpit Kumar — AI &amp; Full-Stack Developer" />
    <meta name="twitter:description" content="Computer Science Engineer building AI, full-stack, SaaS, mobile and cybersecurity software." />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0a0a0b" />

    <!-- Structured Data - Person -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Arpit Kumar",
      "jobTitle": "Computer Science Engineer",
      "description": "Computer Science Engineering student building AI-powered products, full-stack systems, mobile applications and security-focused software.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Bengaluru",
        "addressCountry": "India"
      },
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Alliance University"
      },
      "knowsAbout": ["Python", "FastAPI", "React", "React Native", "Machine Learning", "TypeScript", "Firebase", "Cybersecurity"]
    }
    </script>

    <!-- Structured Data - Website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Arpit Kumar — Portfolio",
      "description": "Personal portfolio and engineering showcase of Arpit Kumar"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
